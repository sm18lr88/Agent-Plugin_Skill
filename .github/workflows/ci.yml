name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-plugin
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: agent-plugin

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --frozen

      - name: Run the official Agent Skills validator
        run: uv run agentskills validate "${{ github.workspace }}/agent-plugin"

      - name: Validate the source checkout
        run: uv run python scripts/validate_skill.py "${{ github.workspace }}/agent-plugin" --source-checkout

      - name: Build the skill package
        run: uv run python scripts/package_skill.py "${{ github.workspace }}/agent-plugin" --output "${{ runner.temp }}/agent-plugin.zip"
