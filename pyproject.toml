[project]
name = "agent-plugin-skill"
version = "1.0.0"
description = "Author, review, migrate, validate, and package portable Agent Plugins."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["skills-ref==0.1.1"]

[tool.mypy]
follow_untyped_imports = true
mypy_path = "scripts"
python_version = "3.11"

[tool.ty.environment]
extra-paths = ["./scripts"]
python-version = "3.11"
